[project]
name = "roadman-knowledge-pipeline"
version = "0.1.0"
description = "Roadman Cycling knowledge layer — extraction pipeline (Phase 0)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Direct Postgres access for migrations/seeds (Supabase connection string).
db = ["psycopg[binary]>=3.1"]
# Heavy stage dependencies — install on the worker box, not in CI.
# transcribe/diarize: openai-whisper or faster-whisper, pyannote.audio, torch
# extract/batch: anthropic
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
