name: Newsletter P0 live check
on:
  push:
    branches: [codex/newsletter-p0-livecheck]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and verify P0
        run: |
          set -euo pipefail
          PDF='https://roadmancycling.com/downloads/core-training-guide.pdf'
          WWW_PDF='https://www.roadmancycling.com/downloads/core-training-guide.pdf'
          NEWS='https://roadmancycling.com/newsletter'
          PARTNERS='https://roadmancycling.com/partners'

          for i in $(seq 1 30); do
            rm -f /tmp/core.pdf /tmp/pdf.headers /tmp/news.html /tmp/partners.html
            pdf_code=$(curl -L -sS -o /tmp/core.pdf -D /tmp/pdf.headers -w '%{http_code}' --max-time 30 "$PDF" || true)
            news_code=$(curl -L -sS -o /tmp/news.html -w '%{http_code}' --max-time 30 "$NEWS" || true)
            partners_code=$(curl -L -sS -o /tmp/partners.html -w '%{http_code}' --max-time 30 "$PARTNERS" || true)

            pdf_type=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{gsub(/\r/,""); v=$0} END{sub(/^content-type:[[:space:]]*/,"",v); print v}' /tmp/pdf.headers)
            pdf_size=$(wc -c < /tmp/core.pdf 2>/dev/null || echo 0)
            pdf_magic=$(head -c 5 /tmp/core.pdf 2>/dev/null || true)
            pdf_final=$(curl -L -sS -o /dev/null -w '%{url_effective}' --max-time 30 "$PDF" || true)
            www_final=$(curl -L -sS -o /dev/null -w '%{url_effective}' --max-time 30 "$WWW_PDF" || true)

            news_ok=0
            partners_ok=0
            if grep -q '23,000 weekly readers' /tmp/news.html && ! grep -Eq '30,000\+|30K\+|65%\+' /tmp/news.html; then news_ok=1; fi
            if (grep -q '23,000 weekly readers' /tmp/partners.html || grep -q '>23K<' /tmp/partners.html) && ! grep -Eq '30,000\+|30K\+|65%\+' /tmp/partners.html; then partners_ok=1; fi

            echo "attempt=$i pdf_code=$pdf_code pdf_type=$pdf_type pdf_size=$pdf_size pdf_magic=$pdf_magic pdf_final=$pdf_final www_final=$www_final news_code=$news_code news_ok=$news_ok partners_code=$partners_code partners_ok=$partners_ok"

            if [ "$pdf_code" = 200 ] && [[ "$pdf_type" == application/pdf* ]] && [ "$pdf_size" -gt 6500000 ] && [ "$pdf_size" -lt 6700000 ] && [ "$pdf_magic" = '%PDF-' ] && [ "$pdf_final" = "$PDF" ] && [ "$www_final" = "$PDF" ] && [ "$news_code" = 200 ] && [ "$news_ok" = 1 ] && [ "$partners_code" = 200 ] && [ "$partners_ok" = 1 ]; then
              echo 'LIVE_P0_OK'
              exit 0
            fi
            sleep 20
          done

          echo 'LIVE_P0_FAILED'
          exit 1
