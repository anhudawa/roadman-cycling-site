name: Newsletter P0 preview QA

on:
  pull_request:
    branches: [main]

jobs:
  preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Preview production build
        env:
          VERCEL_ENV: preview
        run: npm run build
